  '@astrojs/react>vite': 7.3.7
  '@xhmikosr/decompress': ^11.1.4
  axios: ^1.20.0
  'body-parser@1': 1.20.9
  brace-expansion: ^5.0.12
  compression: ^1.8.2
  devalue: 5.9.3
  'minimatch@3>brace-expansion': ^2.1.7
  fast-uri: ^3.1.9
  'follow-redirects@1': 1.16.1
  'handlebars@4': 4.7.10
  http-cache-semantics: ^4.3.0
  js-yaml: ^4.3.2
  less: ^4.9.1
  'launch-editor@2': 2.14.2
  nanoid: ^3.3.18
  'piscina@4': ^4.9.4
  postcss: ^8.5.24
  'postcss-selector-parser@7': ^7.1.6
  proxy-addr: ^2.0.8
