name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: https://chakra-docs.dev
      CHAKRA_DOCS_REQUIRE_SITE_URL: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit complete dependency tree
        run: pnpm run audit:dependencies

      - name: Check formatting
        run: pnpm nx format:check --all

      - name: Release workflow tests
        run: pnpm run test:release

      - name: Lint
        run: pnpm nx run-many -t lint --parallel=3

      - name: Typecheck
        run: pnpm nx run-many -t typecheck --parallel=3

      - name: Unit tests with coverage
        run: pnpm nx run-many -t test --coverage --parallel=3

      - name: Build
        run: pnpm nx run-many -t build --parallel=3

      - name: Check public theme declaration performance
        run: pnpm run types:performance:check

      - name: Check search performance
        run: pnpm run search:performance:check

      - name: Browser tests
        run: pnpm nx run docs:e2e --skipNxCache

      - name: Package consumer smoke test
        run: pnpm run release:smoke

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-main-diagnostics-${{ github.run_attempt }}
          path: |
            coverage
            **/coverage
            **/test-output
            apps/docs/.next/trace
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  node-22-compatibility:
    name: Node 22 package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.0'

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm nx run-many -t typecheck --exclude=docs --parallel=3

      - name: Test packages with coverage
        run: pnpm nx run-many -t test --coverage --parallel=3

      - name: Build packages
        run: pnpm nx run-many -t build --exclude=docs --parallel=3

      - name: Package consumer smoke test
        run: pnpm run release:smoke

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-node-22-diagnostics-${{ github.run_attempt }}
          path: |
            coverage
            **/coverage
            **/test-output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify patched development-only advisory and expiry
        run: pnpm run audit:dependencies
      - name: Audit production dependencies without exceptions
        run: pnpm audit --prod --audit-level=moderate
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Version-based review cannot detect pnpm patches. The preceding gate
          # verifies this exact dev-only mitigation, expiring 2026-11-04 UTC.
          # It fails on a missing patch, runtime exposure, or an upstream fix.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm

  minimum-peers:
    name: Minimum supported peers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.0'

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --exclude=docs --parallel=3

      - name: Test packed packages against minimum peers
        env:
          CHAKRA_DOCS_PEER_PROFILE: minimum
        run: pnpm run release:smoke

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-minimum-peers-diagnostics-${{ github.run_attempt }}
          path: |
            coverage
            **/coverage
            **/test-output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
