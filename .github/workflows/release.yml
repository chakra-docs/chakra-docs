name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version already committed on the default branch, such as 0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Preview package publication without publishing'
        required: true
        default: true
        type: boolean
      first_release:
        description: 'Use only when the packages have never been published'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  require-source:
    name: Require public default branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject an invalid release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from $DEFAULT_BRANCH." >&2
            exit 1
          fi
          if [ "$REPOSITORY_PRIVATE" = 'true' ]; then
            echo 'Provenance-enabled releases require this repository to be public.' >&2
            exit 1
          fi
          echo "Release is pinned to $DEFAULT_BRANCH at $GITHUB_SHA."

  require-ci:
    name: Require successful CI for release commit
    needs: require-source
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the exact default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          ci_run_id="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="$DEFAULT_BRANCH" \
              -f event=push \
              -f head_sha="$VERIFIED_SHA" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [ -z "$ci_run_id" ]; then
            echo "No successful CI push run exists for $VERIFIED_SHA." >&2
            echo 'Wait for CI to complete successfully, then dispatch Release again.' >&2
            exit 1
          fi
          echo "CI run $ci_run_id successfully verified $VERIFIED_SHA."

  dry-run:
    name: Preview release
    if: inputs.dry_run
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm install --global npm@11.13.0

      - run: npm ci

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/assert-release-version.mjs "$RELEASE_VERSION"

      - name: Build packages
        run: npm exec nx -- run-many -t build --parallel=3

      - name: Preview package publication
        env:
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          publish_args=(--dry-run)
          if [ "$FIRST_RELEASE" = 'true' ]; then
            publish_args+=(--first-release)
          fi
          npm exec nx -- release publish "${publish_args[@]}"

  publish:
    name: Publish release
    if: ${{ !inputs.dry_run }}
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install --global npm@11.13.0

      - run: npm ci

      - name: Require the verified default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          default_branch_sha="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )"
          if [ "$current_sha" != "$VERIFIED_SHA" ]; then
            echo "Expected verified commit $VERIFIED_SHA, checked out $current_sha." >&2
            exit 1
          fi
          if [ "$default_branch_sha" != "$VERIFIED_SHA" ]; then
            echo "$DEFAULT_BRANCH advanced after release verification; dispatch a new release." >&2
            exit 1
          fi

      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/assert-release-version.mjs "$RELEASE_VERSION"

      - name: Build packages
        run: npm exec nx -- run-many -t build --parallel=3

      - name: Validate the one-time bootstrap token
        if: inputs.first_release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_BOOTSTRAP_TOKEN is required for the first publish.' >&2
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org >/dev/null

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ inputs.first_release && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Keep the registry existence check enabled, including during bootstrap,
          # so retrying this exact release skips packages that already published.
          npm exec nx -- release publish

      - name: Verify all packages are public
        env:
          NODE_AUTH_TOKEN: ''
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-published-version.mjs "$RELEASE_VERSION"
